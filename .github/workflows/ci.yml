name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check all tsconfigs
        run: npm run typecheck

  build-helper:
    name: Build Rust helper (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Clippy
        run: cargo clippy -p cove-replay-engine -- -D warnings

      - name: Build helper
        run: cargo build --release -p cove-replay-engine

  build-helper-windows:
    name: Build Rust helper (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cargo check (Windows)
        run: cargo check -p cove-replay-engine --target x86_64-pc-windows-msvc

      - name: Clippy (Windows)
        run: cargo clippy -p cove-replay-engine --target x86_64-pc-windows-msvc -- -D warnings

  build-electron:
    name: Build Electron app (Linux)
    needs: [typecheck, build-helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Build Rust helper
        run: npm run build:helper:linux

      - name: Package (dry-run, no publish)
        run: npx electron-builder --linux AppImage --publish never
