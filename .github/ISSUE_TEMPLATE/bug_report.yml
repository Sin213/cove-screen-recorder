name: Bug report
description: Report a reproducible problem with Cove Screen Recorder
title: "bug: "
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: OS / distro / version
      placeholder: e.g. Arch Linux 2026.05.01, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: desktop-env
    attributes:
      label: Desktop environment and session type
      description: Include whether you are running Wayland or X11.
      placeholder: e.g. GNOME 46 on Wayland, KDE Plasma 6 on X11
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Cove Screen Recorder version
      placeholder: e.g. 1.1.0
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What actually happens? Screenshots and logs are encouraged.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: other-info
    attributes:
      label: Other relevant information
      description: Logs, crash output, related issues, or anything else that may help.
    validations:
      required: false
