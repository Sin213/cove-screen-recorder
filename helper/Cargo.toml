[package]
name = "cove-replay-engine"
version = "0.1.0"
edition = "2021"
description = "Native helper replay engine for Cove Screen Recorder"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
pipewire = "0.9"

[dev-dependencies]
tempfile = "3"
